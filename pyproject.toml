[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lumenspace-terminal"
version = "1.0.2"
description = "A local price research terminal for linked transform spaces"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1",
  "numpy>=2.0,<3", "pandas>=2.2,<4", "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2", "PyWavelets>=1.6,<2", "plotly>=5.24,<7",
  "tzdata>=2024.1", "PyYAML>=6,<7"
]
[project.optional-dependencies]
topology = ["ripser>=0.6.10,<1"]
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
[tool.setuptools.packages.find]
include = ["terminal", "terminal.*"]
namespaces = false

[tool.setuptools.package-data]
terminal = ["static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"terminal/_vendor/**" = ["E", "F"]
